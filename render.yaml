services:
  - type: web
    name: turtle-v34-splinter
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_v34:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    healthCheckPath: /api/v34/health
    autoDeploy: true
